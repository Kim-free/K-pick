    url: jdbc:mysql://localhost:3306/kpick?serverTimezone=UTC&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=5000

    username: root
    password: kolkol2233

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    database: mysql
    hibernate:
