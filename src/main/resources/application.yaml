
spring:
  application:
    name: kpick
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kpick?serverTimezone=UTC&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=5000

    username: root
    password: kolkol2233

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    database: mysql
    hibernate:
      ddl-auto: create
    generate-ddl: false
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

oauth2:
  apple:
    client-id: com.freshmilk.picktory
    services-id: com.freshmilk.picktory.login
    team-id:
    key-id:
    private-key-path: classpath:keys/AuthKey_ABC123XYZ.p8
    redirect-uri: http://localhost:3000/auth/apple/callback
    android-redirect-uri: http://localhost:3000/auth/apple/callback
    android-deep-link-uri: picktory://auth/callback
  google:
    client-id:
    client-secret:
    redirect-uri: http://localhost:3000/auth/google/callback
  kakao:
    client-id:
    client-secret:
    redirect-uri: http://localhost:3000/auth/kakao/callback

  web:
    resources:
      static-locations: file:uploads/images/ #file: ? ?? ??? ? ??? ? ???? ?? ???? ???? ????
    cors:
      allowed-origins: http://localhost:3000



jwt:
  secret:
  access-token-expiration: 86400000

admin:
  emails: ${ADMIN_EMAILS:}

auth:
  dev-bypass:
    enabled: ${AUTH_DEV_BYPASS_ENABLED:false}
    app-user-id: ${AUTH_DEV_BYPASS_APP_USER_ID:1}
    profile-id: ${AUTH_DEV_BYPASS_PROFILE_ID:1}
    role: ${AUTH_DEV_BYPASS_ROLE:ADMIN}
  test-token:
    enabled: ${AUTH_TEST_TOKEN_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

storage:
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${S3_ACCESS_KEY:local-s3-access-key}
    secret-key: ${S3_SECRET_KEY:local-s3-secret-key}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    endpoint: ${S3_ENDPOINT:}
    presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}

firebase:
  fcm:
    enabled: ${FCM_ENABLED:false}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
