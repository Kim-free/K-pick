jwt:
  secret:
  access-token-expiration: 86400000

admin:
  emails: ${ADMIN_EMAILS:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

storage:
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-northeast-2}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    endpoint: ${S3_ENDPOINT:}
    presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}
